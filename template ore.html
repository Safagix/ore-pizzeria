<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#e63946">
    <title>Ore Pizza POS</title>
    <style>
        :root {
            /* Paleta de Colores Moderna */
            --primary: #e63946;
            --primary-dark: #c1121f;
            --secondary: #1d3557;
            --bg-body: #f1f5f9;
            --surface: #ffffff;
            --text-main: #333333;
            --text-muted: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius: 12px;
        }

        * { 
            box-sizing: border-box; margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
        }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            height: 100vh; 
            display: flex; flex-direction: column; 
            overflow: hidden; 
        }

        /* --- UI Helpers --- */
        .hidden { display: none !important; }
        .btn { 
            padding: 12px 20px; border: none; border-radius: var(--radius); 
            cursor: pointer; font-weight: 600; width: 100%; 
            font-size: 0.9rem; transition: all 0.2s; 
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); color: white; box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3); }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-success { background-color: var(--success); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-icon { width: auto; padding: 5px 12px; background: rgba(255,255,255,0.15); font-size: 0.8rem; }

        /* --- Contenedor Principal (Centrado en PC) --- */
        .app-container {
            width: 100%;
            height: 100%;
            display: flex; flex-direction: column;
            max-width: 1600px; /* Límite de ancho para monitores ultra anchos */
            margin: 0 auto;
            background: var(--bg-body);
            position: relative;
        }

        /* --- Selector de Rol --- */
        #role-selector {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; background: var(--secondary);
            color: white; gap: 40px; padding: 20px; text-align: center;
            background-image: radial-gradient(circle at 10% 20%, rgb(29, 53, 87) 0%, rgb(15, 25, 40) 90%);
        }
        .role-cards { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px; }
        .role-card {
            background: var(--surface); color: var(--text-main); padding: 40px 30px; border-radius: 20px;
            width: 180px; cursor: pointer; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.3s ease;
        }
        .role-card:hover { transform: translateY(-5px); }
        .role-card:active { transform: scale(0.95); }
        .role-icon { font-size: 4rem; margin-bottom: 20px; }
        
        /* --- Headers --- */
        header { 
            background-color: var(--surface); color: var(--text-main); 
            padding: 15px 20px; display: flex; justify-content: space-between; 
            align-items: center; box-shadow: var(--shadow-sm); z-index: 20; 
            height: 60px; flex-shrink: 0;
        }
        .brand { font-size: 1.2rem; font-weight: 800; color: var(--secondary); display: flex; align-items: center; gap: 10px; }

        /* --- Layout Cajero (Responsive) --- */
        .cashier-layout { 
            display: flex; 
            flex-direction: column; 
            height: calc(100vh - 60px); /* Restar header */ 
            position: relative;
            overflow: hidden;
        }

        /* Área de Menú (Scrollable) */
        .menu-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 200px; /* Espacio para el carrito en móvil */
        }

        .menu-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 16px; 
            max-width: 1200px; margin: 0 auto;
        }

        .product-card { 
            background: var(--surface); border-radius: 16px; overflow: hidden; 
            box-shadow: var(--shadow-sm); display: flex; flex-direction: column; 
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .product-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .product-img { height: 120px; background-color: #e2e8f0; object-fit: cover; width: 100%; }
        .product-info { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .product-name { font-weight: 700; color: var(--text-main); font-size: 1rem; }
        .product-price { color: var(--primary); font-weight: 800; font-size: 1.2rem; }
        .btn-add { margin-top: auto; padding: 10px; font-size: 0.85rem; }

        /* Panel de Carrito (Panel Lateral PC / Barra Inferior Móvil) */
        .cart-panel { 
            background: var(--surface); border-top: 1px solid #e2e8f0; 
            padding: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); z-index: 30;
            display: flex; flex-direction: column; gap: 15px;
        }

        .cart-items-scroll { 
            flex: 1; overflow-y: auto; 
            max-height: 150px; /* Limite para móvil */
        }

        .cart-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem;
        }
        .item-name { font-weight: 500; }
        .remove-btn { color: var(--danger); padding: 5px; cursor: pointer; font-weight: bold; font-size: 1.1rem; }

        .cart-summary { border-top: 2px dashed #e2e8f0; padding-top: 15px; }
        .cart-total { font-size: 1.5rem; font-weight: 900; color: var(--text-main); text-align: right; margin-bottom: 15px; }

        /* --- Media Queries (La magia del diseño) --- */
        
        /* Tablet y PC (Ancho mayor a 768px) */
        @media (min-width: 768px) {
            .cashier-layout { flex-direction: row; }
            
            .menu-area {
                flex: 1;
                padding: 30px;
                padding-bottom: 30px;
            }
            
            .cart-panel { 
                width: 380px; /* Ancho fijo lateral */
                height: 100%; 
                border-top: none; 
                border-left: 1px solid #e2e8f0;
                border-radius: 20px 0 0 20px;
                position: sticky; top: 0;
            }

            .cart-items-scroll { max-height: none; } /* Ocupa todo el alto disponible */
            .menu-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; }
            .product-img { height: 150px; }
        }

        /* --- Layout Cocina --- */
        .kitchen-container {
            flex: 1; overflow-y: auto; padding: 20px; background-color: #f8fafc;
        }
        .kitchen-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; max-width: 1400px; margin: 0 auto;
        }
        .ticket { 
            background: var(--surface); border-radius: 12px; overflow: hidden;
            box-shadow: var(--shadow-md); border: 1px solid #e2e8f0;
            animation: slideUp 0.3s ease-out;
        }
        .ticket.completed { opacity: 0.6; background-color: #f1f5f9; }
        .ticket-header { 
            background: #f8fafc; padding: 12px 16px; border-bottom: 1px solid #e2e8f0; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .ticket-id { font-weight: 900; color: var(--secondary); font-size: 1.1rem; }
        .ticket-body { padding: 16px; }
        .ticket-items { list-style: none; margin-bottom: 20px; }
        .ticket-items li { 
            padding: 8px 0; font-size: 1rem; border-bottom: 1px solid #f1f5f9; 
            display: flex; justify-content: space-between;
        }
        .ticket-actions { padding: 0 16px 16px 16px; }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Loader */
        #loader { position: fixed; inset: 0; background: #fff; z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f4f6; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loader" class="hidden">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-weight: bold; color: var(--secondary);">Conectando con Ore Pizza...</p>
    </div>

    <div class="app-container">
        <!-- Selector -->
        <section id="role-selector">
            <div class="brand" style="color: white; font-size: 2rem; justify-content: center;">
                <span>🍕</span> ORE PIZZA
            </div>
            <p style="opacity: 0.8; font-size: 1.1rem;">Sistema de Pedidos</p>
            <div class="role-cards">
                <div class="role-card" onclick="app.setRole('cashier')">
                    <span class="role-icon">💰</span>
                    <h3>Cajero</h3>
                </div>
                <div class="role-card" onclick="app.setRole('kitchen')">
                    <span class="role-icon">👨‍🍳</span>
                    <h3>Cocina</h3>
                </div>
            </div>
        </section>

        <!-- Cajero -->
        <section id="cashier-view" class="hidden" style="height: 100%; display: flex; flex-direction: column;">
            <header>
                <div class="brand">🍕 POS ORE</div>
                <button class="btn btn-icon" onclick="location.reload()">Salir</button>
            </header>
            
            <div class="cashier-layout">
                <!-- Menú (Izquierda/Centro) -->
                <div class="menu-area">
                    <div class="menu-grid" id="menu-container"></div>
                </div>

                <!-- Carrito (Derecha/Abajo) -->
                <div class="cart-panel">
                    <h3 style="margin-bottom: 10px; color: var(--text-muted);">Orden Actual</h3>
                    <div class="cart-items-scroll" id="cart-container">
                        <p style="text-align:center; color: #cbd5e1; padding: 20px;">Vacío</p>
                    </div>
                    <div class="cart-summary">
                        <div class="cart-total" id="cart-total">$0.00</div>
                        <button class="btn btn-primary" onclick="app.sendOrder()" style="padding: 16px; font-size: 1.1rem;">ENVIAR A COCINA</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Cocina -->
        <section id="kitchen-view" class="hidden" style="height: 100%; display: flex; flex-direction: column;">
            <header style="background: var(--secondary); color: white;">
                <div class="brand" style="color: white;">🔥 PANTALLA COCINA</div>
                <button class="btn btn-icon" style="background: rgba(255,255,255,0.2); color: white;" onclick="location.reload()">Salir</button>
            </header>
            <div class="kitchen-container">
                <div class="kitchen-grid" id="kitchen-container"></div>
            </div>
        </section>
    </div>

    <!-- Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ⚠️ CONFIGURACIÓN FIREBASE (TUS DATOS) ⚠️
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "your-app.firebaseapp.com",
            databaseURL: "https://your-app-default-rtdb.firebaseio.com/",
            projectId: "your-project-id",
            storageBucket: "your-app.firebasestorage.app",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456",
            measurementId: "G-MEASUREMENT_ID"
        };

        // --- Menú ---
        const menuData = [
            { id: 1, name: "Pizza Pepperoni", price: 12.00, img: "https://picsum.photos/seed/ore1/300/200" },
            { id: 2, name: "Pizza Hawaiana", price: 10.50, img: "https://picsum.photos/seed/ore2/300/200" },
            { id: 3, name: "Pizza 4 Quesos", price: 13.00, img: "https://picsum.photos/seed/ore3/300/200" },
            { id: 4, name: "Refresco Cola", price: 2.50, img: "https://picsum.photos/seed/oredrink/300/200" },
            { id: 5, name: "Papas Fritas", price: 3.00, img: "https://picsum.photos/seed/orefries/300/200" },
            { id: 6, name: "Pizza Napolitana", price: 11.50, img: "https://picsum.photos/seed/ore4/300/200" },
            { id: 7, name: "Pizza Muzzarella", price: 10.00, img: "https://picsum.photos/seed/ore5/300/200" },
        ];

        const app = {
            role: null,
            cart: [],
            dbRef: null,

            init: function() {
                const loader = document.getElementById('loader');
                loader.classList.remove('hidden');
                try {
                    if (typeof firebase === 'undefined') throw new Error("Sin internet.");
                    firebase.initializeApp(firebaseConfig);
                    this.dbRef = firebase.database().ref('orders');
                    loader.classList.add('hidden');
                    console.log("Conectado a Firebase");
                } catch (e) {
                    loader.classList.add('hidden');
                    alert("Error de conexión: " + e.message);
                }
            },

            setRole: function(role) {
                this.role = role;
                document.getElementById('role-selector').classList.add('hidden');
                if (role === 'cashier') {
                    document.getElementById('cashier-view').classList.remove('hidden');
                    this.renderMenu();
                } else {
                    document.getElementById('kitchen-view').classList.remove('hidden');
                    this.startListeningToKitchen();
                }
            },

            // --- Cajero ---
            renderMenu: function() {
                const html = menuData.map(item => `
                    <div class="product-card">
                        <img src="${item.img}" class="product-img" loading="lazy" alt="${item.name}">
                        <div class="product-info">
                            <div class="product-name">${item.name}</div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:auto;">
                                <span class="product-price">$${item.price.toFixed(2)}</span>
                                <button class="btn btn-primary btn-add" onclick="app.addToCart(${item.id})">+ Agregar</button>
                            </div>
                        </div>
                    </div>
                `).join('');
                document.getElementById('menu-container').innerHTML = html;
            },

            addToCart: function(id) {
                this.cart.push(menuData.find(p => p.id === id));
                this.renderCart();
            },

            removeFromCart: function(index) {
                this.cart.splice(index, 1);
                this.renderCart();
            },

            renderCart: function() {
                const container = document.getElementById('cart-container');
                const totalEl = document.getElementById('cart-total');
                if (this.cart.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding: 30px; color: #cbd5e1; border: 2px dashed #e2e8f0; border-radius: 12px;">Carrito vacío</div>';
                    totalEl.textContent = 'Total: $0.00';
                    return;
                }
                let total = 0;
                container.innerHTML = this.cart.map((item, index) => {
                    total += item.price;
                    return `
                    <div class="cart-item">
                        <span class="item-name">${item.name}</span>
                        <div style="display:flex; align-items:center; gap: 10px;">
                            <span style="font-weight:bold;">$${item.price.toFixed(2)}</span>
                            <span class="remove-btn" onclick="app.removeFromCart(${index})">✕</span>
                        </div>
                    </div>`;
                }).join('');
                totalEl.textContent = '$' + total.toFixed(2);
            },

            sendOrder: function() {
                if (this.cart.length === 0) return alert("El carrito está vacío.");
                
                this.dbRef.push({
                    id: Date.now().toString().slice(-6),
                    items: [...this.cart],
                    status: 'pending',
                    timestamp: new Date().toLocaleTimeString()
                }, function(error) {
                    if (error) alert("Error: " + error.message);
                });

                this.cart = [];
                this.renderCart();
            },

            // --- Cocina ---
            startListeningToKitchen: function() {
                this.dbRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    const container = document.getElementById('kitchen-container');
                    
                    if (!data) {
                        container.innerHTML = '<p style="text-align:center; padding:50px; color:#94a3b8;">No hay pedidos pendientes.</p>';
                        return;
                    }
                    
                    const orders = Object.entries(data).map(([key, value]) => ({ key, ...value }));
                    orders.sort((a, b) => (a.status === b.status) ? 0 : a.status === 'completed' ? 1 : -1);
                    
                    container.innerHTML = orders.map(order => `
                        <div class="ticket ${order.status === 'completed' ? 'completed' : ''}">
                            <div class="ticket-header">
                                <span class="ticket-id">#${order.id}</span>
                                <span style="font-size:0.85rem; font-weight:600; color:#64748b;">${order.timestamp}</span>
                            </div>
                            <div class="ticket-body">
                                <ul class="ticket-items">
                                    ${order.items.map(i => `
                                        <li>
                                            <span>${i.name}</span>
                                            <span style="color:#94a3b8;">x1</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                            <div class="ticket-actions">
                                ${order.status === 'pending' 
                                    ? `<button class="btn btn-success" onclick="app.completeOrder('${order.key}')">MARCAR LISTO</button>` 
                                    : `<div style="text-align:center; font-weight:bold; color:var(--success); background:#ecfdf5; padding:10px; border-radius:8px;">✅ COMPLETADO</div>`
                                }
                            </div>
                        </div>
                    `).join('');
                }, (error) => {
                    alert("Error escuchando cocina: " + error.message);
                });
            },

            completeOrder: function(key) {
                this.dbRef.child(key).update({ status: 'completed' });
            }
        };

        app.init();
    </script>
</body>
</html>
